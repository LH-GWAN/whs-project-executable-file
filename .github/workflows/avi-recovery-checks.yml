name: AVI recovery checks

on:
  push:
    branches: [avi-damage-recovery]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python 3.12 / regression and AVI recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_DISABLE_SANDBOX: "1"
      QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Qt runtime and real video decoder
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libegl1 libopengl0 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libnss3 libasound2t64 libdbus-1-3
          python -m pip install --upgrade pip
          python -m pip install "PySide6==6.11.2" pytest
      - name: Verify dependencies and Python syntax
        run: |
          python -m pip check
          ffmpeg -version
          node --version
          python -m compileall -q app.py core engine ui storage report tests
          python -m core.avi_recovery --help
      - name: Run full regression and real AVI decoding tests
        run: python -m pytest -q tests --junitxml=test-results.xml
      - name: Require complete test execution
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          suites = ET.parse("test-results.xml").getroot().findall("testsuite")
          totals = {key: sum(int(s.get(key, 0)) for s in suites) for key in ("tests", "failures", "errors", "skipped")}
          print(totals)
          assert totals["tests"] >= 96, totals
          assert totals["failures"] == totals["errors"] == totals["skipped"] == 0, totals
          PY
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avi-recovery-test-results
          path: test-results.xml
          if-no-files-found: warn
