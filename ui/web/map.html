<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="maplibre-gl.css">
<script src="maplibre-gl.js"></script>
<script src="pmtiles.js"></script>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #eef1f4; }
  #map { position: absolute; inset: 0; }
  .maplibregl-ctrl-attrib { font-size: 10px; }

  #status {
    position: absolute; left: 8px; bottom: 8px; z-index: 5;
    background: rgba(255,255,255,.92); border: 1px solid #ccc; border-radius: 3px;
    padding: 4px 8px; font: 11px -apple-system, "Malgun Gothic", sans-serif; color: #444;
    max-width: 60%;
  }
  #legend {
    position: absolute; right: 8px; top: 8px; z-index: 5;
    background: rgba(255,255,255,.92); border: 1px solid #ccc; border-radius: 3px;
    padding: 6px 9px; font: 11px -apple-system, "Malgun Gothic", sans-serif; color: #333;
  }
  #legend div { display: flex; align-items: center; gap: 6px; margin: 2px 0; }
  #followBtn {
    position: absolute; right: 8px; bottom: 8px; z-index: 6;
    border: 1px solid #ccc; border-radius: 3px; padding: 5px 10px; cursor: pointer;
    font: 11px -apple-system, "Malgun Gothic", sans-serif;
    background: rgba(255,255,255,.92); color: #666;
  }
  #followBtn.on { background: #1c7ed6; border-color: #1c7ed6; color: #fff; }
  #legend i { width: 16px; height: 0; border-top-width: 3px; border-top-style: solid; }
  #legend .lg-arrow { width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent;
    border-bottom: 12px solid #1c7ed6; display: inline-block; margin: 0 2px; }
  /* 리포트용 캡처 중에는 조작 요소를 숨긴다(범례는 남긴다) */
  body.capture #followBtn, body.capture #status, body.capture .maplibregl-ctrl-top-left,
  body.capture .maplibregl-ctrl-bottom-left { display: none !important; }
</style>
</head>
<body>
<div id="map"></div>
<div id="legend">
  <div><i style="border-color:#1a9e5c"></i> 주행 경로</div>
  <div><i style="border-color:#e03131"></i> 급가속 의심 구간</div>
  <div><i style="border-color:#f08c00"></i> 급감속 의심 구간</div>
  <div><i style="border-color:#9aa4ad; border-top-style:dashed"></i> GPS 끊김 구간</div>
  <div><span class="lg-arrow"></span> 현재 위치 (진행 방향)</div>
</div>
<button id="followBtn" class="on" title="영상 재생에 맞춰 지도를 따라 움직입니다">따라가기 켜짐</button>
<div id="status">지도 준비 중…</div>

<script>
"use strict";

const EMPTY_STYLE = {
  version: 8,
  sources: {},
  layers: [{ id: "bg", type: "background", paint: { "background-color": "#eef1f4" } }],

};

let map = null;
let trackData = null;
let pendingTrack = null;
let followEnabled = true;
let selfMove = false;
let fallbackNote = "";
// 따라가기 상자: 화면의 80% (가장자리에서 10%씩 안쪽)
const FOLLOW_MARGIN = 0.10;

function setStatus(text) {
  document.getElementById("status").textContent = text;
}

async function addBasemapIfAvailable() {
  let cfg = {};
  try {
    cfg = await (await fetch("map-config")).json();
  } catch (e) { return false; }

  // 온라인 지도는 별도 페이지(map_kakao.html)가 맡는다. 온라인을 골랐는데 키가 없어
  // 이 페이지로 온 경우만 여기서 알 수 있으니 상태 문구에 그 사실을 남긴다.
  if (cfg.mode === "online") fallbackNote = " · 온라인 지도 키를 찾지 못해 오프라인 지도로 표시 (설정 > 온라인 지도 키 설정 안내)";

  if (!cfg.available) return false;

  try {
    const protocol = new pmtiles.Protocol();
    maplibregl.addProtocol("pmtiles", protocol.tile);
    const url = new URL("basemap.pmtiles", window.location.href).href;
    protocol.add(new pmtiles.PMTiles(url));

    map.addSource("basemap", {
      type: "vector",
      url: "pmtiles://" + url,
      attribution: "© OpenStreetMap contributors (ODbL)",
    });

    map.addLayer({ id: "bm-earth", type: "fill", source: "basemap",
      "source-layer": "earth", paint: { "fill-color": "#f5f3ee" } });

    map.addLayer({ id: "bm-landuse", type: "fill", source: "basemap",
      "source-layer": "landuse",
      paint: {
        "fill-color": ["match", ["get", "kind"],
          ["park", "forest", "wood", "grass", "nature_reserve", "scrub"], "#dfe9d8",
          ["hospital", "school", "university", "college"], "#ecebe4",
          ["industrial", "commercial", "retail"], "#eeeae4",
          "#eceae4"],
        "fill-opacity": 0.8,
      } });

    map.addLayer({ id: "bm-water", type: "fill", source: "basemap",
      "source-layer": "water", paint: { "fill-color": "#b9d6ea" } });

    map.addLayer({ id: "bm-buildings", type: "fill", source: "basemap",
      "source-layer": "buildings", minzoom: 13,
      paint: { "fill-color": "#e2ded7", "fill-outline-color": "#d3cec6" } });

    const byKind = (hw, major, medium, other) =>
      ["match", ["get", "kind"],
        "highway", hw, "major_road", major, "medium_road", medium, other];
    const roadWidth = (scale) => ["interpolate", ["exponential", 1.4], ["zoom"],
      6,  byKind(3.2 * scale * 0.4, 2.4 * scale * 0.4, 1.8 * scale * 0.4, 1.2 * scale * 0.4),
      10, byKind(3.2 * scale * 0.8, 2.4 * scale * 0.8, 1.8 * scale * 0.8, 1.2 * scale * 0.8),
      14, byKind(3.2 * scale * 2.2, 2.4 * scale * 2.2, 1.8 * scale * 2.2, 1.2 * scale * 2.2),
      17, byKind(3.2 * scale * 5.0, 2.4 * scale * 5.0, 1.8 * scale * 5.0, 1.2 * scale * 5.0)];

    map.addLayer({ id: "bm-roads-case", type: "line", source: "basemap",
      "source-layer": "roads", minzoom: 9,
      layout: { "line-cap": "round", "line-join": "round" },
      paint: { "line-color": "#d8d2c8", "line-width": roadWidth(1.0) } });

    map.addLayer({ id: "bm-roads", type: "line", source: "basemap",
      "source-layer": "roads",
      layout: { "line-cap": "round", "line-join": "round" },
      paint: {
        "line-color": ["match", ["get", "kind"],
          "highway", "#fcd9a4", "major_road", "#ffffff",
          "medium_road", "#ffffff", "minor_road", "#ffffff", "#f2efe9"],
        "line-width": roadWidth(0.72),
      } });

    map.addLayer({ id: "bm-boundaries", type: "line", source: "basemap",
      "source-layer": "boundaries",
      paint: { "line-color": "#b3aca2", "line-width": 0.8, "line-dasharray": [3, 2] } });

    return true;
  } catch (e) {
    console.warn("[map] 배경지도 로드 실패, 궤적만 표시합니다:", e);
    return false;
  }
}

function buildFeatures(points, flagged) {
  const solid = [], dashed = [], flaggedLines = [], decelLines = [];
  // 구간 종류: 급가속(accel) / 급감속(decel). 같은 구간의 두 점이 모두 표시돼야 그 선이 칠해진다.
  const flaggedKind = new Map();
  (flagged || []).forEach(([s, e, kind]) => { for (let i = s; i <= e; i++) flaggedKind.set(i, kind || "accel"); });

  let prev = null;
  let sawDropout = false;
  for (let i = 0; i < points.length; i++) {
    const p = points[i];
    if (p.lat === null || p.lon === null) {
      // 이상치(o)는 좌표를 지도에 쓰지 않되 끊김으로도 치지 않는다 - 앞뒤 정상 지점을 실선으로 잇는다.
      if (p.d) sawDropout = true;
      continue;
    }
    if (prev !== null) {
      const seg = [[points[prev].lon, points[prev].lat], [p.lon, p.lat]];
      // 두 끝점이 같은 종류의 구간에 있을 때만 그 색을 칠한다(급가속→급감속 경계 선분은 일반 주행).
      const k1 = flaggedKind.get(i), k0 = flaggedKind.get(prev);
      if (k1 && k0 && k1 === k0) (k1 === "decel" ? decelLines : flaggedLines).push(seg);
      else if (sawDropout) dashed.push(seg);
      else solid.push(seg);
    }
    prev = i;
    sawDropout = false;
  }
  const fc = (coords) => ({
    type: "FeatureCollection",
    features: coords.map((c) => ({ type: "Feature", geometry: { type: "LineString", coordinates: c }, properties: {} })),
  });
  return { solid: fc(solid), dashed: fc(dashed), flagged: fc(flaggedLines), decel: fc(decelLines) };
}

function renderTrack(payload) {

  if (!window.__mapReady) { pendingTrack = payload; trackData = payload; return; }
  trackData = payload;
  const pts = payload.points || [];
  const fixes = pts.filter((p) => p.lat !== null && p.lon !== null);

  const f = buildFeatures(pts, payload.flagged);
  const setData = (id, data) => {
    if (map.getSource(id)) map.getSource(id).setData(data);
  };
  setData("trk-solid", f.solid);
  setData("trk-dashed", f.dashed);
  setData("trk-flagged", f.flagged);
  setData("trk-decel", f.decel);

  const ends = { type: "FeatureCollection", features: [] };
  if (fixes.length) {
    ends.features.push({ type: "Feature", properties: { kind: "start" },
      geometry: { type: "Point", coordinates: [fixes[0].lon, fixes[0].lat] } });
    ends.features.push({ type: "Feature", properties: { kind: "end" },
      geometry: { type: "Point", coordinates: [fixes[fixes.length - 1].lon, fixes[fixes.length - 1].lat] } });
  }
  setData("trk-ends", ends);
  setData("trk-pos", { type: "FeatureCollection", features: [] });

  if (fixes.length) {

    let minX = 180, minY = 90, maxX = -180, maxY = -90;
    for (const p of fixes) {
      if (p.lon < minX) minX = p.lon;
      if (p.lon > maxX) maxX = p.lon;
      if (p.lat < minY) minY = p.lat;
      if (p.lat > maxY) maxY = p.lat;
    }
    if (minX === maxX && minY === maxY) {
      map.jumpTo({ center: [minX, minY], zoom: 16 });
    } else {
      map.fitBounds([[minX, minY], [maxX, maxY]], { padding: 48, duration: 0, maxZoom: 17 });
    }
    // 리포트 기준 지도: 화면을 맞춘 직후 타일까지 다 그려지면 Python이 캡처한다.
    window.__trackDrawn = (window.__trackDrawn || 0) + 1;
    window.__trackIdle = false;
    map.once("idle", function () { window.__trackIdle = true; });

    const dropouts = pts.reduce((n, p) => n + (p.d ? 1 : 0), 0);
    const outliers = pts.reduce((n, p) => n + (p.o ? 1 : 0), 0);
    setStatus(`좌표 ${fixes.length}개` + (dropouts ? ` · GPS 끊김 ${dropouts}개 지점` : "")
      + (outliers ? ` · 이상치 ${outliers}개 제외` : "")
      + (window.__hasBasemap ? "" : " · 배경지도 없음(궤적만 표시)") + fallbackNote);
  } else {
    setStatus(pts.length ? "GPS 수신이 없는 구간뿐이라 표시할 좌표가 없습니다."
                          : "표시할 GPS 좌표가 없습니다.");
  }
}

function setPlaybackTime(sec) {
  if (!trackData || !map || !map.getSource("trk-pos")) return;
  const pts = trackData.points || [];
  let best = null;
  for (const p of pts) {
    if (p.t === null || p.lat === null) continue;
    if (p.t <= sec) best = p; else break;
  }
  const fc = { type: "FeatureCollection", features: [] };
  if (best) {
    const props = (best.h === null || best.h === undefined) ? {} : { bearing: best.h };
    fc.features.push({ type: "Feature", properties: props,
      geometry: { type: "Point", coordinates: [best.lon, best.lat] } });
  }
  map.getSource("trk-pos").setData(fc);

  // 확대해서 보면 차량이 금방 화면 밖으로 나가서 사용자가 마우스로 계속 따라가야 했다.
  // 화면 가운데에 가로세로 80% 크기의 상자가 있다고 보고, 마커가 그 상자를 벗어나면
  // 마커가 화면 가운데에 오도록 지도를 옮긴다. 매번 가운데에 두면 GPS가 갱신되는
  // 매초 지도가 움직여 읽기 어려워서, 상자 안에 있는 동안은 지도를 가만히 둔다.
  // 사용자가 직접 지도를 움직이면 따라가기를 꺼서, 보고 싶은 곳을 뺏지 않는다.
  if (best && followEnabled) {
    const pt = map.project([best.lon, best.lat]);
    const c = map.getCanvas();
    const mx = c.clientWidth * FOLLOW_MARGIN;
    const my = c.clientHeight * FOLLOW_MARGIN;
    if (pt.x < mx || pt.x > c.clientWidth - mx || pt.y < my || pt.y > c.clientHeight - my) {
      selfMove = true;
      map.easeTo({ center: [best.lon, best.lat], duration: 420 });
    }
  }
}

function setFollow(on) {
  followEnabled = !!on;
  const btn = document.getElementById("followBtn");
  if (btn) {
    btn.classList.toggle("on", followEnabled);
    btn.textContent = followEnabled ? "따라가기 켜짐" : "따라가기 꺼짐";
  }
}

// 진행 방향 화살표 아이콘. 위(북)를 향하는 삼각형을 그려 두고 icon-rotate로 돌린다.
function makeArrowImage(size) {
  const c = document.createElement("canvas");
  c.width = size; c.height = size;
  const g = c.getContext("2d");
  g.clearRect(0, 0, size, size);
  g.beginPath();
  g.moveTo(size / 2, size * 0.06);
  g.lineTo(size * 0.90, size * 0.90);
  g.lineTo(size / 2, size * 0.70);
  g.lineTo(size * 0.10, size * 0.90);
  g.closePath();
  g.fillStyle = "#1c7ed6";
  g.fill();
  g.lineWidth = size * 0.09;
  g.strokeStyle = "#ffffff";
  g.lineJoin = "round";
  g.stroke();
  return g.getImageData(0, 0, size, size);
}

function addTrackLayers() {
  const empty = { type: "FeatureCollection", features: [] };
  for (const id of ["trk-solid", "trk-dashed", "trk-flagged", "trk-decel", "trk-ends", "trk-pos"]) {
    map.addSource(id, { type: "geojson", data: empty });
  }
  if (!map.hasImage("pos-arrow")) map.addImage("pos-arrow", makeArrowImage(64), { pixelRatio: 2 });
  map.addLayer({ id: "l-dashed", type: "line", source: "trk-dashed",
    paint: { "line-color": "#9aa4ad", "line-width": 2, "line-dasharray": [2, 2] } });
  map.addLayer({ id: "l-solid", type: "line", source: "trk-solid",
    layout: { "line-cap": "round", "line-join": "round" },
    paint: { "line-color": "#1a9e5c", "line-width": 4 } });
  map.addLayer({ id: "l-flagged", type: "line", source: "trk-flagged",
    layout: { "line-cap": "round", "line-join": "round" },
    paint: { "line-color": "#e03131", "line-width": 6 } });
  map.addLayer({ id: "l-decel", type: "line", source: "trk-decel",
    layout: { "line-cap": "round", "line-join": "round" },
    paint: { "line-color": "#f08c00", "line-width": 6 } });
  map.addLayer({ id: "l-ends", type: "circle", source: "trk-ends",
    paint: {
      "circle-radius": 7,
      "circle-color": ["match", ["get", "kind"], "start", "#1a9e5c", "#111111"],
      "circle-stroke-color": "#ffffff", "circle-stroke-width": 2,
    } });
  // 방향을 모르는 지점(첫 측정 전 등)은 원, 아는 지점은 진행 방향으로 돌린 화살표.
  map.addLayer({ id: "l-pos", type: "circle", source: "trk-pos",
    filter: ["!", ["has", "bearing"]],
    paint: { "circle-radius": 8, "circle-color": "#1c7ed6",
             "circle-stroke-color": "#ffffff", "circle-stroke-width": 3 } });
  map.addLayer({ id: "l-pos-arrow", type: "symbol", source: "trk-pos",
    filter: ["has", "bearing"],
    layout: {
      "icon-image": "pos-arrow", "icon-size": 0.55,
      "icon-rotate": ["get", "bearing"], "icon-rotation-alignment": "map",
      "icon-allow-overlap": true, "icon-ignore-placement": true,
    } });
}

let initStarted = false;

async function initOnce() {
  if (initStarted) return;
  initStarted = true;

  let hasBasemap = false;
  try {
    hasBasemap = await addBasemapIfAvailable();
  } catch (e) {
    console.warn("[map] 배경지도 단계 실패:", e);
  }
  try {
    addTrackLayers();
    window.__mapReady = true;
    window.__hasBasemap = hasBasemap;
    if (pendingTrack) { const t = pendingTrack; pendingTrack = null; renderTrack(t); }
    else setStatus((hasBasemap ? "지도 준비 완료" : "배경지도 없음 · 궤적만 표시합니다") + fallbackNote);
  } catch (e) {

    window.__mapError = String((e && e.stack) || e);
    console.error("[map] 레이어 초기화 실패:", e);
    setStatus("지도 초기화 실패: " + ((e && e.message) || e));
  }
}

function boot() {
  map = new maplibregl.Map({
    container: "map",
    style: EMPTY_STYLE,
    center: [127.0, 37.5],
    zoom: 10,
    attributionControl: { compact: true },
  });
  map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "top-left");

  document.getElementById("followBtn").addEventListener("click", function () {
    setFollow(!followEnabled);
  });
  // 사용자가 끌면 따라가기를 끈다. 우리가 easeTo로 움직인 건 제외한다.
  map.on("dragstart", function () { setFollow(false); });
  map.on("moveend", function () { selfMove = false; });
  map.addControl(new maplibregl.ScaleControl({ maxWidth: 120, unit: "metric" }));

  map.on("load", initOnce);
  if (map.loaded() || map.isStyleLoaded()) initOnce();

  let waited = 0;
  const poll = setInterval(() => {
    if (initStarted) { clearInterval(poll); return; }
    waited += 400;
    if (map.isStyleLoaded && map.isStyleLoaded()) {
      clearInterval(poll);
      console.warn("[map] load 이벤트가 오지 않아 폴링으로 초기화합니다 " +
                   "(WebGL 렌더 루프 문제일 수 있음).");
      initOnce();
    } else if (waited >= 8000) {
      clearInterval(poll);
      window.__mapError = "style_never_loaded";
      setStatus("지도를 초기화하지 못했습니다 (그래픽 가속 문제일 수 있음)");
    }
  }, 400);

  map.on("error", (e) => {
    const msg = (e && e.error && e.error.message) || String(e && e.error || e);

    console.warn("[map] " + msg);
    window.__lastMapError = msg;
  });
}

boot();

function setCaptureMode(on) { document.body.classList.toggle("capture", !!on); }

window.renderTrack = renderTrack;
window.setPlaybackTime = setPlaybackTime;
window.setFollow = setFollow;
window.setCaptureMode = setCaptureMode;
</script>
</body>
</html>
