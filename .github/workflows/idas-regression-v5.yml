name: IDAS regression (V5)

on:
  push:
    branches:
      - main
      - image-upload-v5
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-full:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg and Qt libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libnss3 libasound2t64 libxss1 libxtst6 libxkbfile1
      - name: Install project packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Interpreter and decoder versions
        run: |
          python --version
          ffmpeg -version | head -1
          ffprobe -version | head -1
      - name: Compile all project Python files
        run: python -m compileall -q app.py core engine report storage ui tests
      - name: Full pytest including real FFmpeg and native Qt widget cases
        run: python -m pytest -q tests
      - name: Explain skipped tests
        if: always()
        run: python -m pytest -q -rs tests

  windows-full:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          $env:PATH = [System.Environment]::GetEnvironmentVariable("Path", "Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path", "User")
          ffmpeg -version
          ffprobe -version
      - name: Install project packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile all project Python files
        run: python -m compileall -q app.py core engine report storage ui tests
      - name: Full pytest on native Windows runner
        run: python -m pytest -q tests
      - name: Explain skipped tests
        if: always()
        run: python -m pytest -q -rs tests
