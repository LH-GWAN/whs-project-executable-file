name: IDAS regression (AVI recovery)

on:
  push:
    branches: [avi-damage-recovery]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-full
            os: ubuntu-24.04
          - name: windows-full
            os: windows-2022
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_DISABLE_SANDBOX: "1"
      QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Linux FFmpeg and Qt libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libnss3 libasound2t64 libxss1 libxtst6 libxkbfile1 libdbus-1-3
      - name: Install Windows FFmpeg
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $machinePath = [System.Environment]::GetEnvironmentVariable("Path", "Machine")
          $userPath = [System.Environment]::GetEnvironmentVariable("Path", "User")
          ($machinePath + ";" + $userPath).Split(";") | Where-Object { $_ } | Add-Content $env:GITHUB_PATH
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "PySide6==6.11.2"
      - name: Verify dependencies and Python syntax
        run: |
          python -m pip check
          python --version
          ffmpeg -version
          ffprobe -version
          node --version
          python -m compileall -q app.py core engine ui storage report tests
          python -m core.avi_recovery --help
      - name: Full pytest including real AVI decode and Qt cases
        timeout-minutes: 5
        run: python -m pytest -vv -ra -o faulthandler_timeout=60 tests --junitxml=test-results.xml
      - name: Require complete test execution
        shell: python
        run: |
          import xml.etree.ElementTree as ET
          suites = ET.parse("test-results.xml").getroot().findall("testsuite")
          totals = {key: sum(int(s.get(key, 0)) for s in suites) for key in ("tests", "failures", "errors", "skipped")}
          print(totals)
          assert totals["tests"] >= 111, totals
          assert totals["failures"] == totals["errors"] == totals["skipped"] == 0, totals
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-test-results
          path: test-results.xml
          if-no-files-found: warn
