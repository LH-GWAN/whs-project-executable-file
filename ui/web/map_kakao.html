<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 카카오는 요청의 Referer 출처로 등록 도메인을 확인한다. 브라우저 기본 정책에 맡기지 않고
     출처를 항상 보내도록 고정한다(안 보내면 도메인 검사 이전에 다른 이유로 거절된다). -->
<meta name="referrer" content="origin">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #eef1f4; overflow: hidden; }
  #map { position: absolute; inset: 0; }

  /* 카카오 로고가 지도 왼쪽 아래에 그려진다(약관상 가리면 안 됨). 상태 표시는 그 오른쪽에 둔다. */
  #status {
    position: absolute; left: 96px; bottom: 8px; z-index: 5;
    background: rgba(255,255,255,.92); border: 1px solid #ccc; border-radius: 3px;
    padding: 4px 8px; font: 11px -apple-system, "Malgun Gothic", sans-serif; color: #444;
    max-width: 55%;
  }
  #legend {
    position: absolute; right: 8px; top: 8px; z-index: 5;
    background: rgba(255,255,255,.92); border: 1px solid #ccc; border-radius: 3px;
    padding: 6px 9px; font: 11px -apple-system, "Malgun Gothic", sans-serif; color: #333;
  }
  #legend div { display: flex; align-items: center; gap: 6px; margin: 2px 0; }
  #legend i { width: 16px; height: 0; border-top-width: 3px; border-top-style: solid; }
  #followBtn {
    position: absolute; right: 8px; bottom: 8px; z-index: 6;
    border: 1px solid #ccc; border-radius: 3px; padding: 5px 10px; cursor: pointer;
    font: 11px -apple-system, "Malgun Gothic", sans-serif;
    background: rgba(255,255,255,.92); color: #666;
  }
  #followBtn.on { background: #1c7ed6; border-color: #1c7ed6; color: #fff; }

  .trk-dot {
    width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid #fff; box-shadow: 0 0 3px rgba(0,0,0,.45); box-sizing: border-box;
  }
  .trk-start { background: #1a9e5c; }
  .trk-end { background: #111111; }
  .trk-pos { width: 18px; height: 18px; border-width: 3px; background: #1c7ed6; }
</style>
</head>
<body>
<div id="map"></div>
<div id="legend">
  <div><i style="border-color:#1a9e5c"></i> 주행 경로</div>
  <div><i style="border-color:#e03131"></i> 급가속 의심 구간</div>
  <div><i style="border-color:#9aa4ad; border-top-style:dashed"></i> GPS 끊김 구간</div>
</div>
<button id="followBtn" class="on" title="영상 재생에 맞춰 지도를 따라 움직입니다">따라가기 켜짐</button>
<div id="status">온라인 지도 준비 중…</div>

<script>
"use strict";

// Python 쪽(ui/map_view.py)이 폴링하는 상태. "loading" -> "ready" 또는 "error:<원인>".
// 원인 값은 core/kakao_api.py의 KIND_*와 같다.
window.__mapReady = false;
window.__onlineMapState = "loading";
window.__onlineMapError = "";

const SDK_URL = "https://dapi.kakao.com/v2/maps/sdk.js";
const SDK_TIMEOUT_MS = 15000;

const FAIL_MESSAGES = {
  quota: "온라인 지도 사용 한도 초과 · 오늘은 사용할 수 없습니다 (궤적만 표시)",
  domain: "온라인 지도 사용 불가 · 카카오 디벨로퍼스에 이 프로그램 주소가 등록되지 않음",
  disabled: "온라인 지도 사용 불가 · 카카오 디벨로퍼스 앱에서 카카오맵 사용 설정이 꺼짐",
  key: "온라인 지도 사용 불가 · JavaScript 키 오류",
  network: "인터넷에 연결할 수 없어 온라인 지도를 불러오지 못했습니다 (궤적만 표시)",
  unknown: "온라인 지도를 불러오지 못했습니다 (궤적만 표시)",
};

let map = null;
let trackData = null;
let pendingTrack = null;
let followEnabled = true;
let polylines = [];
let startOverlay = null, endOverlay = null, posOverlay = null;

function setStatus(text) {
  document.getElementById("status").textContent = text;
}

function setState(state, message) {
  window.__onlineMapState = state;
  window.__onlineMapError = message || "";
}

function fail(kind, message) {
  setState("error:" + kind, message);
  setStatus(FAIL_MESSAGES[kind] || FAIL_MESSAGES.unknown);
  // 궤적 데이터는 받아 두되 그릴 지도가 없다. 상태 문구가 사용자에게 사유를 알린다.
}

async function fetchJson(path) {
  try {
    return await (await fetch(path, { cache: "no-store" })).json();
  } catch (e) {
    return null;
  }
}

function loadSdk(key) {
  return new Promise((resolve, reject) => {
    const script = document.createElement("script");
    const timer = setTimeout(() => reject(new Error("timeout")), SDK_TIMEOUT_MS);
    script.onload = () => { clearTimeout(timer); resolve(); };
    script.onerror = () => { clearTimeout(timer); reject(new Error("load_failed")); };
    script.src = SDK_URL + "?appkey=" + encodeURIComponent(key) + "&autoload=false";
    document.head.appendChild(script);
  });
}

async function boot() {
  const cfg = await fetchJson("map-config");
  if (!cfg || !cfg.kakaoJsKey) {
    fail("key", "JavaScript 키가 설정되지 않았습니다");
    return;
  }

  // 테스트에서 가짜 SDK를 먼저 넣어 둘 수 있게, 이미 있으면 내려받지 않는다.
  if (!(window.kakao && window.kakao.maps)) {
    try {
      await loadSdk(cfg.kakaoJsKey);
    } catch (e) {
      // 브라우저는 스크립트 로드 실패 이유(401/403/429)를 알려주지 않는다.
      // 로컬 서버가 같은 조건으로 다시 받아 보고 원인을 알려준다.
      const diag = await fetchJson("online-map-diagnose");
      fail((diag && diag.kind) || "network", (diag && diag.message) || String(e.message || e));
      return;
    }
  }
  if (!(window.kakao && window.kakao.maps && typeof window.kakao.maps.load === "function")) {
    fail("unknown", "SDK 객체가 없습니다");
    return;
  }
  try {
    window.kakao.maps.load(initMap);
  } catch (e) {
    fail("unknown", String(e.message || e));
  }
}

function makeDot(cls) {
  return new kakao.maps.CustomOverlay({
    position: new kakao.maps.LatLng(37.5, 127.0),
    content: '<div class="trk-dot ' + cls + '"></div>',
    xAnchor: 0.5, yAnchor: 0.5,
    zIndex: cls === "trk-pos" ? 20 : 10,
  });
}

function initMap() {
  try {
    map = new kakao.maps.Map(document.getElementById("map"), {
      center: new kakao.maps.LatLng(37.5, 127.0),
      level: 8,
    });
    map.addControl(new kakao.maps.ZoomControl(), kakao.maps.ControlPosition.TOPLEFT);
    // 사용자가 끌면 따라가기를 끈다. 우리가 panTo로 움직인 건 dragstart를 내지 않는다.
    kakao.maps.event.addListener(map, "dragstart", function () { setFollow(false); });

    startOverlay = makeDot("trk-start");
    endOverlay = makeDot("trk-end");
    posOverlay = makeDot("trk-pos");

    // 컨테이너 크기가 바뀌면(탭 분할선 이동, 창 크기 변경) 카카오 지도는 내부 뷰포트를
    // 다시 잡아야 한다. 초기화 당시 작았던 화면 기준으로 맞춘 범위도 다시 맞춘다 -
    // 단, 사용자가 직접 지도를 움직인 뒤(따라가기 꺼짐)에는 보던 곳을 뺏지 않는다.
    let resizeTimer = null;
    window.addEventListener("resize", function () {
      if (resizeTimer) clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function () {
        resizeTimer = null;
        if (!map) return;
        map.relayout();
        if (followEnabled && trackData) fitToTrack(trackData);
      }, 150);
    });

    window.__mapReady = true;
    setState("ready", "");
    if (pendingTrack) {
      const t = pendingTrack;
      pendingTrack = null;
      renderTrack(t);
    } else {
      setStatus("온라인 지도 준비 완료");
    }
  } catch (e) {
    fail("unknown", String((e && e.message) || e));
  }
}

function latLng(p) {
  return new kakao.maps.LatLng(p.lat, p.lon);
}

// 연속된 같은 종류의 구간을 하나의 선으로 묶는다. 지점이 수천 개라 구간마다 객체를
// 만들면 무겁다. 종류가 바뀌는 지점은 양쪽 선이 공유해 끊김이 없게 한다.
function buildRuns(points, flagged) {
  const flaggedSet = new Set();
  (flagged || []).forEach(([s, e]) => { for (let i = s; i <= e; i++) flaggedSet.add(i); });

  const runs = { solid: [], dashed: [], flagged: [] };
  let current = null, currentKind = null;
  let prev = null;
  let sawDropout = false;
  for (let i = 0; i < points.length; i++) {
    const p = points[i];
    if (p.lat === null || p.lon === null) {
      if (p.d) sawDropout = true;
      continue;
    }
    if (prev !== null) {
      let kind;
      if (flaggedSet.has(i) && flaggedSet.has(prev)) kind = "flagged";
      else if (sawDropout) kind = "dashed";
      else kind = "solid";
      if (current === null || kind !== currentKind) {
        current = [latLng(points[prev]), latLng(p)];
        runs[kind].push(current);
        currentKind = kind;
      } else {
        current.push(latLng(p));
      }
    }
    prev = i;
    sawDropout = false;
  }
  return runs;
}

const LINE_STYLES = {
  dashed: { strokeWeight: 3, strokeColor: "#9aa4ad", strokeOpacity: 0.9, strokeStyle: "dashed", zIndex: 1 },
  solid: { strokeWeight: 5, strokeColor: "#1a9e5c", strokeOpacity: 0.9, strokeStyle: "solid", zIndex: 2 },
  flagged: { strokeWeight: 7, strokeColor: "#e03131", strokeOpacity: 0.95, strokeStyle: "solid", zIndex: 3 },
};

function renderTrack(payload) {
  if (!window.__mapReady) { pendingTrack = payload; trackData = payload; return; }
  trackData = payload;
  const pts = payload.points || [];
  const fixes = pts.filter((p) => p.lat !== null && p.lon !== null);

  polylines.forEach((l) => l.setMap(null));
  polylines = [];
  const runs = buildRuns(pts, payload.flagged);
  for (const kind of ["dashed", "solid", "flagged"]) {
    for (const path of runs[kind]) {
      const line = new kakao.maps.Polyline(Object.assign({ path: path }, LINE_STYLES[kind]));
      line.setMap(map);
      polylines.push(line);
    }
  }

  posOverlay.setMap(null);
  if (fixes.length) {
    startOverlay.setPosition(latLng(fixes[0]));
    startOverlay.setMap(map);
    endOverlay.setPosition(latLng(fixes[fixes.length - 1]));
    endOverlay.setMap(map);
    fitToTrack(payload);

    const dropouts = pts.reduce((n, p) => n + (p.d ? 1 : 0), 0);
    setStatus(`좌표 ${fixes.length}개` + (dropouts ? ` · GPS 끊김 ${dropouts}개 지점` : ""));
  } else {
    startOverlay.setMap(null);
    endOverlay.setMap(null);
    setStatus(pts.length ? "GPS 수신이 없는 구간뿐이라 표시할 좌표가 없습니다."
                          : "표시할 GPS 좌표가 없습니다.");
  }
}

function fitToTrack(payload) {
  const fixes = (payload.points || []).filter((p) => p.lat !== null && p.lon !== null);
  if (!fixes.length) return;
  const bounds = new kakao.maps.LatLngBounds();
  fixes.forEach((p) => bounds.extend(latLng(p)));
  if (fixes.length === 1 || bounds.isEmpty()) {
    map.setCenter(latLng(fixes[0]));
    map.setLevel(3);
  } else {
    map.setBounds(bounds, 48, 48, 48, 48);
    if (map.getLevel() < 2) map.setLevel(2);
  }
}

function setPlaybackTime(sec) {
  if (!trackData || !map || !posOverlay) return;
  const pts = trackData.points || [];
  let best = null;
  for (const p of pts) {
    if (p.t === null || p.lat === null) continue;
    if (p.t <= sec) best = p; else break;
  }
  if (!best) { posOverlay.setMap(null); return; }
  const pos = latLng(best);
  posOverlay.setPosition(pos);
  posOverlay.setMap(map);

  // 확대해서 보면 차량이 금방 화면 밖으로 나가서 사용자가 마우스로 계속 따라가야 했다.
  // 마커가 가장자리에 가까워지면 지도를 그쪽으로 밀어준다. 사용자가 직접 지도를
  // 움직이면 따라가기를 꺼서, 보고 싶은 곳을 뺏지 않는다.
  if (followEnabled) {
    const el = document.getElementById("map");
    const pt = map.getProjection().containerPointFromCoords(pos);
    const mx = el.clientWidth * 0.25;
    const my = el.clientHeight * 0.25;
    if (pt.x < mx || pt.x > el.clientWidth - mx || pt.y < my || pt.y > el.clientHeight - my) {
      map.panTo(pos);
    }
  }
}

function setFollow(on) {
  followEnabled = !!on;
  const btn = document.getElementById("followBtn");
  if (btn) {
    btn.classList.toggle("on", followEnabled);
    btn.textContent = followEnabled ? "따라가기 켜짐" : "따라가기 꺼짐";
  }
}

document.getElementById("followBtn").addEventListener("click", function () {
  setFollow(!followEnabled);
});

boot();

window.renderTrack = renderTrack;
window.setPlaybackTime = setPlaybackTime;
window.setFollow = setFollow;
</script>
</body>
</html>
